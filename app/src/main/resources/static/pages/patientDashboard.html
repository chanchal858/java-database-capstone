<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Patient Dashboard</title>

    <link rel="icon" href="../assets/images/logo/logo.png">

    <link rel="stylesheet" href="../assets/css/adminDashboard.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/patientDashboard.css">

    <!-- Utility scripts -->
    <script src="../js/render.js" defer></script>
    <script src="../js/util.js" defer></script>

    <!-- Components -->
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script type="module" src="../js/components/modals.js"></script>
</head>

<body onload="renderContent()">

    <div class="container">

        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>

            <main class="main-content">

                <!-- Search bar -->
                <input
                    type="text"
                    id="searchBar"
                    class="searchBar"
                    placeholder="Search Bar for custom output"
                />

                <!-- Filters -->
                <div class="filter-wrapper">

                    <select class="filter-select" id="filterTime">
                        <option value="">Filter by Time</option>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>

                    <select class="filter-select" id="filterSpecialty">
                        <option value="">Filter by Specialty</option>
                    </select>

                </div>

                <!-- Doctor cards -->
                <div id="content"></div>

            </main>

            <!-- Footer -->
            <div id="footer"></div>

        </div>

    </div>

    <!-- Reusable Modal -->
    <div id="modal" class="modal">

        <div class="modal-content">

            <span class="close" id="closeModal">&times;</span>

            <div id="modal-body"></div>

        </div>

    </div>

    <!-- Patient dashboard logic -->
    <script
        type="module"
        src="../js/patientDashboard.js"
        defer>
    </script>

</body>

</html>
