<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>

<body>

    <div class="container">

        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>

            <main class="main-content">

                <!-- Search bar -->
                <input
                    type="text"
                    id="searchBar"
                    placeholder="search by doctor name"
                />

                <!-- Filters -->
                <div class="filter-section">

                    <!-- Sort by time -->
                    <select id="timeFilter">
                        <option value="">Sort by time</option>
                        <option value="asc">Earliest</option>
                        <option value="desc">Latest</option>
                    </select>

                    <!-- Filter by specialty -->
                    <select id="specialtyFilter">
                        <option value="">Filter by specialty</option>
                    </select>

                </div>

                <!-- Doctor cards will be inserted here -->
                <div id="content"></div>

            </main>

            <!-- Footer -->
            <div id="footer"></div>

        </div>

    </div>

    <!-- Add Doctor Modal -->
    <div id="modal" class="modal">

        <span id="closeModal" class="close">&times;</span>

        <div id="modal-body"></div>

    </div>

    <!-- Admin dashboard JavaScript -->
    <script
        type="module"
        src="../js/services/adminDashboard.js"
        defer>
    </script>

    <!-- Doctor card component -->
    <script
        type="module"
        src="../js/components/doctorCard.js"
        defer>
    </script>

</body>

</html>
