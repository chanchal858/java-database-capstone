<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>DoctorDashboard</title>

    <link rel="icon" th:href="@{/assets/images/logo/logo.png}">

    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- Utility files -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- Components -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>

    <!-- Services and main logic -->
    <script th:src="@{/js/services/patientServices.js}" defer></script>
    <script th:src="@{/js/doctorDashboard.js}" defer></script>
</head>

<body>

    <div class="container">

        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>

            <main class="main-content">

                <!-- Search -->
                <input
                    type="text"
                    id="searchBar"
                    placeholder="Search by patient name"
                />

                <!-- Filters -->
                <div class="filter-section">

                    <button id="todayAppointments">
                        Today's Appointments
                    </button>

                    <input
                        type="date"
                        id="appointmentDate"
                    />

                </div>

                <!-- Patient Records -->
                <table id="patientTable">

                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Prescription</th>
                        </tr>
                    </thead>

                    <tbody id="patientTableBody">
                        <!-- Patient records will be populated dynamically -->
                    </tbody>

                </table>

            </main>

            <!-- Footer -->
            <div id="footer"></div>

        </div>

    </div>

</body>

</html>
